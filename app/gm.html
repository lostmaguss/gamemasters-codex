<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1517"><title>GM remote · Gamemaster's Codex</title>
<link rel="stylesheet" href="/app/styles.css">
<style>
  html, body { height: auto; overflow: auto; }
  body { padding: 0 0 calc(76px + env(safe-area-inset-bottom)); background: var(--bg); -webkit-tap-highlight-color: transparent; }
  .top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(12px + env(safe-area-inset-top)) 16px 10px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; }
  .top h1 { font-size: 22px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top small { display: block; color: var(--faint); font: 600 11px var(--body); letter-spacing: .1em; text-transform: uppercase; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); flex: none; } .dot.on { background: var(--good); }
  main { padding: 14px 14px 20px; display: flex; flex-direction: column; gap: 12px; }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg-2); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabs button { height: 62px; border: 0; background: none; color: var(--dim); font: 600 13px var(--body); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .tabs button.on { color: var(--ember); } .tabs svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .big { height: 64px; width: 100%; border-radius: 10px; border: 0; background: var(--ember); color: var(--ember-ink); font: 700 20px var(--body); }
  .big.alt { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line); height: 52px; font-size: 16px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 10px; padding: 10px 12px; }
  .who { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .who.cur { border-color: var(--ember); background: color-mix(in srgb, var(--ember) 14%, var(--surface)); }
  .who.down { opacity: .5; } .who b { font-size: 16px; } .who .hp { font: 600 15px var(--mono); display: block; border: 0; border-radius: 0; background: none; } .who .hp small { color: var(--faint); }
  .who .bar { grid-column: 1 / -1; height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; } .who .bar i { display: block; height: 100%; background: var(--good); }
  .who .ctl { grid-column: 1 / -1; display: flex; gap: 6px; } .who .ctl input { flex: 1; height: 40px; font-size: 16px; }
  .who .ctl button, .pm button { min-width: 48px; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 700 18px var(--body); }
  .who .meta { grid-column: 1 / -1; color: var(--dim); font-size: 12.5px; }
  .pm { display: flex; gap: 6px; }
  h2 { font-size: 24px; margin-top: 6px; }
  .chk { display: flex; gap: 12px; align-items: flex-start; padding: 12px; } .chk input { width: 22px; height: 22px; flex: none; margin-top: 1px; } .chk.done span { color: var(--faint); text-decoration: line-through; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; } .chips button { height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 600 15px var(--body); }
  .chips button span { font: 500 12px var(--mono); color: var(--faint); margin-left: 6px; }
  .res { text-align: center; padding: 16px; } .res b { display: block; font: 700 54px var(--display); color: var(--ember); } .res small { color: var(--dim); font: 12px var(--mono); }
  .ho { display: flex; justify-content: space-between; align-items: center; gap: 10px; } .ho.on { border-color: var(--ember); }
  .ho button { height: 40px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font-weight: 600; }
  .ho.on button { background: var(--ember); color: var(--ember-ink); border-color: var(--ember); }
  .muted { color: var(--faint); text-align: center; padding: 30px 10px; }
  .start { background: var(--paper); color: var(--card-ink); font: 16px/1.45 var(--hand); }
  input[type=text] { width: 100%; height: 48px; font-size: 16px; }
  .off { position: fixed; inset: 0; z-index: 9; display: none; place-items: center; background: rgba(0,0,0,.7); color: #fff; font: 600 17px var(--body); text-align: center; padding: 30px; }
  .off.show { display: grid; }
</style></head>
<body>
<div class="top"><i class="dot" id="dot"></i><div style="flex:1;min-width:0"><small id="sub">GM remote</small><h1 id="title">Connecting…</h1></div><b class="mono" id="clock"></b></div>
<main id="main"></main>
<nav class="tabs">
  <button data-tab="fight" class="on"><svg viewBox="0 0 24 24"><path d="M14.5 17.5 3 6V3h3l11.5 11.5M13 19l6-6M16 16l4 4M19 21l2-2"/></svg>Fight</button>
  <button data-tab="scene"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 19V5"/></svg>Scene</button>
  <button data-tab="show"><svg viewBox="0 0 24 24"><path d="M3 5h18v12H3zM8 21h8M12 17v4"/></svg>Show</button>
  <button data-tab="roll"><svg viewBox="0 0 24 24"><path d="M12 2 3 7v10l9 5 9-5V7zM12 22V12M3 7l9 5 9-5"/></svg>Roll</button>
</nav>
<div class="off" id="off"><span id="offMsg">Lost the connection to the GM's computer.<br>Trying again…</span></div>
<script type="module" src="/app/gm.js"></script>
</body></html>
