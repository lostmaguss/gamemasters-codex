name: macOS diagnostics (temporary)
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx electron-builder --mac dir --arm64 --publish never
      - name: Diagnose
        run: |
          APP="dist-installer/mac-arm64/Gamemasters Codex.app"
          export CODEX_SMOKE="$RUNNER_TEMP/smoke.txt"
          set +e
          perl -e 'alarm 150; exec @ARGV' "$APP/Contents/MacOS/Gamemasters Codex" > "$RUNNER_TEMP/app.log" 2>&1
          code=$?
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-3000; }
          echo "::warning title=exit and report::exit $code; report file: $(ls -la "$CODEX_SMOKE" 2>&1)%0A$(cat "$CODEX_SMOKE" 2>&1 | enc)"
          echo "::warning title=self-test lines::$(grep -i 'SELF-TEST' "$RUNNER_TEMP/app.log" | enc)"
          echo "::warning title=env::RUNNER_TEMP=$RUNNER_TEMP; whoami=$(whoami)"
