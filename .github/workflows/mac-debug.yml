name: macOS diagnostics (temporary)
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx electron-builder --mac dir --arm64 --publish never
      - name: Diagnose
        run: |
          APP="dist-installer/mac-arm64/Gamemasters Codex.app"
          note() { while IFS= read -r l; do echo "::warning title=$1::${l:0:300}"; done; }
          ls "$APP/Contents/MacOS" | note "MacOS dir"
          codesign -dv "$APP" 2>&1 | head -6 | note "codesign"
          export CODEX_SMOKE="$RUNNER_TEMP/smoke.txt" ELECTRON_ENABLE_LOGGING=1 ELECTRON_ENABLE_STACK_DUMPING=1
          set +e
          perl -e 'alarm 150; exec @ARGV' "$APP/Contents/MacOS/Gamemasters Codex" --enable-logging > "$RUNNER_TEMP/app.log" 2>&1
          echo "exit code $?" | note "exit"
          grep -v '^\s*$' "$RUNNER_TEMP/app.log" | tail -30 | note "app log"
          [ -f "$CODEX_SMOKE" ] && cat "$CODEX_SMOKE" | note "report" || echo "no report" | note "report"
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | tail -3 | note "crash reports"
