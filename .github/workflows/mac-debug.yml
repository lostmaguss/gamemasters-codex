name: macOS diagnostics (temporary)
on: workflow_dispatch
jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx electron-builder --mac dir --arm64 --publish never
      - name: Diagnose
        run: |
          APP="dist-installer/mac-arm64/Gamemasters Codex.app"
          BIN="$APP/Contents/MacOS/Gamemasters Codex"
          enc() { sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' | cut -c1-2500; }
          set +e
          # A: run the binary directly in the background, kill after 120 s
          export CODEX_SMOKE="$RUNNER_TEMP/smokeA.txt" ELECTRON_ENABLE_LOGGING=1
          start=$(date +%s); "$BIN" > "$RUNNER_TEMP/a.log" 2>&1 & pid=$!
          for i in $(seq 1 120); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill -0 $pid 2>/dev/null && { kill $pid; echo "killed after 120 s" >> "$RUNNER_TEMP/a.log"; }
          wait $pid; codeA=$?; secs=$(( $(date +%s) - start ))
          echo "::warning title=A direct::exit $codeA after ${secs}s; report: $(cat "$CODEX_SMOKE" 2>&1 | enc)"
          echo "::warning title=A self-test lines::$(grep -i 'SELF-TEST' "$RUNNER_TEMP/a.log" | enc) |"
          echo "::warning title=A log head::$(grep -v '^\s*$' "$RUNNER_TEMP/a.log" | head -8 | enc) |"
          echo "::warning title=A log tail::$(grep -v '^\s*$' "$RUNNER_TEMP/a.log" | tail -8 | enc) |"
          # B: perl with warnings, to see if exec itself fails
          export CODEX_SMOKE="$RUNNER_TEMP/smokeB.txt"
          perl -we 'alarm 120; exec @ARGV or die "exec failed: $!"' "$BIN" > "$RUNNER_TEMP/b.log" 2>&1; codeB=$?
          echo "::warning title=B perl::exit $codeB; report: $(cat "$CODEX_SMOKE" 2>&1 | head -2 | enc); log: $(grep -i 'exec\|SELF-TEST' "$RUNNER_TEMP/b.log" | head -4 | enc) |"
